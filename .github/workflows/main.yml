name: React Build and SCP Deploy

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18' # Specify the Node.js version your project uses

    - name: Building frontend (client)
      run: |
        cd client
        npm install
        npm run build

    - name: copy frontend (client) build files to server (temporary location)
      uses: appleboy/scp-action@v0.1.0
      with:
        port: ${{ secrets.SSH_PORT }}
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        target: /home/admin/skillup/client/
        source: "client/dist"
        overwrite: true
        rm: false

    - name: moving frontend (client) build files from (temporary location) to /var/www/html
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          sudo mv -f /home/admin/skillup/client/dist/* /var/www/html/

    - name: Copy backend code (server) files to server
      uses: appleboy/scp-action@v0.1.0
      with:
        port: ${{ secrets.SSH_PORT }}
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        target: /home/admin/skillup/
        source: "server"
        overwrite: true
        rm: false

    - name: Restarting pm2 and reloading nginx
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd /home/admin/skillup/server
          sudo systemctl stop nginx
          sudo systemctl stop mariadb
          npm install
          sudo systemctl start mariadb
          pm2 restart backend || pm2 start index.js --name backend
          sudo systemctl start nginx
